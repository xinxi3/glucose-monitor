<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - 血糖监测管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            padding: 40px;
        }
        .login-title {
            text-align: center;
            color: #3498db;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .btn-login {
            background-color: #3498db;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-login:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h2 class="login-title"><i class="fa fa-droplet me-2"></i>血糖监测管理系统</h2>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">登录角色</label>
            <select id="role" class="form-select" required>
                <option value="">请选择角色</option>
                <option value="admin">管理员</option>
                <option value="doctor">医生</option>
                <option value="nurse">护士</option>
                <option value="patient">患者</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
        </div>
        <div class="mb-4">
            <label class="form-label">密码</label>
            <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-login w-100">
            <i class="fa fa-sign-in me-1"></i> 登 录
        </button>
    </form>
</div>

<script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const selectRole = document.getElementById('role').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ username, password })
            });

            const data = await res.json();

            if (data.code === 200) {
                const dbRole = data.role;
                if (dbRole !== selectRole) {
                    alert("账号角色与选择角色不匹配！");
                    return;
                }
                alert("登录成功！");
                switch (dbRole) {
                    case 'admin': location.href = 'admin.html'; break;
                    case 'doctor': location.href = 'doctor.html'; break;
                    case 'nurse': location.href = 'nurse.html'; break;
                    case 'patient': location.href = 'patient.html'; break;
                }
            } else {
                alert(data.msg || "用户名或密码错误");
            }
        } catch (err) {
            alert("服务器异常，请稍后重试");
        }
    });
</script>
</body>
</html>
